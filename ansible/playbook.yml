---
- name: Configure application server
  hosts: all
  become: yes

  tasks:
    - name: Update apt package cache
      apt:
        update_cache: yes

    - name: Install Docker
      apt:
        name: docker.io
        state: present

    - name: Start and enable Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Add ubuntu user to Docker group
      user:
        name: ubuntu
        groups: docker
        append: yes

    - name: Create containerd configuration directory
      file:
        path: /etc/containerd
        state: directory
        mode: '0755'

    - name: Generate default containerd configuration
      shell: containerd config default > /etc/containerd/config.toml
      args:
        creates: /etc/containerd/config.toml

    - name: Restart containerd
      service:
        name: containerd
        state: restarted

    - name: Install required packages for Kubernetes setup
      apt:
        name:
          - curl
          - conntrack
          - containernetworking-plugins
        state: present

    - name: Create standard CNI plugin directory
      file:
        path: /opt/cni/bin
        state: directory
        mode: '0755'

    - name: Find installed CNI plugins
      find:
        paths: /usr/lib/cni
        file_type: file
      register: cni_plugins

    - name: Link CNI plugins to standard directory
      file:
        src: "{{ item.path }}"
        dest: "/opt/cni/bin/{{ item.path | basename }}"
        state: link
        force: yes
      loop: "{{ cni_plugins.files }}"

    - name: Install kubectl
      get_url:
        url: https://dl.k8s.io/release/v1.34.1/bin/linux/amd64/kubectl
        dest: /usr/local/bin/kubectl
        mode: '0755'

    - name: Install Minikube
      get_url:
        url: https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
        dest: /usr/local/bin/minikube
        mode: '0755'

    - name: Download crictl
      get_url:
        url: https://github.com/kubernetes-sigs/cri-tools/releases/download/v1.34.0/crictl-v1.34.0-linux-amd64.tar.gz
        dest: /tmp/crictl.tar.gz
        mode: '0644'

    - name: Install crictl
      unarchive:
        src: /tmp/crictl.tar.gz
        dest: /usr/local/bin
        remote_src: yes
        creates: /usr/local/bin/crictl